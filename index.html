<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DisplayPilot</title>
    <link rel="stylesheet" href="/src/panel.css" />
  </head>
  <body class="panel-body">
    <main class="panel" id="panel" aria-busy="true">
      <header class="panel-header" data-tauri-drag-region>
        <div class="brand">
          <img class="app-icon" src="/icon.png" alt="" width="30" height="30" />
          <div class="brand-text">
            <h1>DisplayPilot</h1>
            <p id="display-subtitle">正在连接显示器…</p>
          </div>
        </div>
        <div class="header-actions">
          <button class="icon-button" id="refresh-button" type="button" aria-label="刷新状态" title="刷新状态">
            <svg viewBox="0 0 20 20" aria-hidden="true">
              <path d="M15.6 6.1A6.5 6.5 0 1 0 16.5 10" />
              <path d="M15.9 2.9v3.5h-3.5" />
            </svg>
          </button>
          <button class="icon-button" id="settings-button" type="button" aria-label="打开设置" title="设置">
            <svg viewBox="0 0 20 20" aria-hidden="true">
              <circle cx="10" cy="10" r="2.6" />
              <path d="M10 2.4v2M10 15.6v2M2.4 10h2M15.6 10h2M4.6 4.6l1.4 1.4M14 14l1.4 1.4M15.4 4.6 14 6M6 14l-1.4 1.4" />
            </svg>
          </button>
        </div>
      </header>

      <div class="banner" id="config-banner" role="status" hidden>
        <div class="banner-text">
          <strong>配置需要检查</strong>
          <p id="config-message"></p>
        </div>
        <button class="text-button" id="config-open" type="button">打开配置</button>
      </div>

      <div class="panel-scroll" id="panel-scroll">
        <section class="display-switcher" id="display-switcher" hidden>
          <button
            class="display-button"
            id="display-button"
            type="button"
            aria-haspopup="listbox"
            aria-expanded="false"
          >
            <span class="status-dot" aria-hidden="true"></span>
            <span class="display-button-text">
              <span class="display-name" id="display-name">显示器</span>
              <span class="display-meta" id="display-meta"></span>
            </span>
            <svg class="chevron" viewBox="0 0 16 16" aria-hidden="true">
              <path d="m4 6 4 4 4-4" />
            </svg>
          </button>
          <div class="display-menu" id="display-menu" role="listbox" aria-label="选择显示器" hidden></div>
        </section>

        <section class="card" id="input-card">
          <header class="section-header">
            <h2>输入源</h2>
            <span class="section-note" id="input-note"></span>
          </header>
          <div
            class="input-grid"
            id="input-grid"
            role="group"
            aria-label="切换显示器输入源"
          ></div>
        </section>

        <section class="card" id="brightness-card">
          <header class="section-header">
            <h2>亮度</h2>
            <output class="value" id="brightness-value" for="brightness-slider">--</output>
          </header>
          <div class="slider-line">
            <svg class="slider-icon small" viewBox="0 0 20 20" aria-hidden="true">
              <circle cx="10" cy="10" r="3" />
              <path d="M10 3v1.5M10 15.5V17M3 10h1.5M15.5 10H17M5.1 5.1l1 1M13.9 13.9l1 1M14.9 5.1l-1 1M6.1 13.9l-1 1" />
            </svg>
            <input
              type="range"
              id="brightness-slider"
              min="0"
              max="100"
              step="1"
              aria-label="亮度"
              aria-valuetext="亮度 --"
            />
            <svg class="slider-icon" viewBox="0 0 20 20" aria-hidden="true">
              <circle cx="10" cy="10" r="4" />
              <path d="M10 1.8v2M10 16.2v2M1.8 10h2M16.2 10h2M4.2 4.2l1.4 1.4M14.4 14.4l1.4 1.4M15.8 4.2l-1.4 1.4M5.6 14.4l-1.4 1.4" />
            </svg>
          </div>
          <div class="quick-row" id="brightness-presets" aria-label="亮度预设">
            <button type="button" data-brightness="20">20%</button>
            <button type="button" data-brightness="40">40%</button>
            <button type="button" data-brightness="60">60%</button>
            <button type="button" data-brightness="80">80%</button>
            <button type="button" data-brightness="100">100%</button>
          </div>
          <p class="field-hint" id="brightness-hint" hidden></p>
        </section>

        <section class="card" id="audio-card">
          <header class="section-header">
            <h2>音频</h2>
            <div class="audio-actions">
              <output class="value" id="volume-value" for="volume-slider">--</output>
              <button
                class="mute-button"
                id="mute-button"
                type="button"
                role="switch"
                aria-checked="false"
                aria-label="静音"
                title="静音"
              >
                <svg viewBox="0 0 20 20" aria-hidden="true">
                  <path d="M4 7.5h2.6L10 4.4v11.2L6.6 12.5H4z" />
                  <path class="wave" d="M12.6 7.1a4 4 0 0 1 0 5.8M14.8 5a7 7 0 0 1 0 10" />
                  <path class="slash" d="m13 7.5 4 5M17 7.5l-4 5" />
                </svg>
              </button>
            </div>
          </header>
          <div class="slider-line">
            <svg class="slider-icon small" viewBox="0 0 20 20" aria-hidden="true">
              <path d="M4 7.5h2.6L10 4.4v11.2L6.6 12.5H4z" />
            </svg>
            <input
              type="range"
              id="volume-slider"
              min="0"
              max="100"
              step="1"
              aria-label="音量"
              aria-valuetext="音量 --"
            />
            <svg class="slider-icon" viewBox="0 0 20 20" aria-hidden="true">
              <path d="M4 7.5h2.6L10 4.4v11.2L6.6 12.5H4z" />
              <path d="M12.6 7.1a4 4 0 0 1 0 5.8M14.8 5a7 7 0 0 1 0 10" />
            </svg>
          </div>
          <p class="field-hint" id="volume-hint" hidden></p>
        </section>

        <section class="empty-state" id="empty-state" hidden>
          <div class="empty-icon" aria-hidden="true">
            <svg viewBox="0 0 48 48">
              <rect x="6" y="10" width="36" height="24" rx="4" />
              <path d="M18 39h12M24 34v5" />
            </svg>
          </div>
          <h2>未发现显示器</h2>
          <p id="empty-message">请确认显示器已唤醒，并在 OSD 中启用 DDC/CI。</p>
          <button class="primary-button" id="empty-retry" type="button">重新扫描</button>
        </section>

        <section class="inline-error" id="error-panel" role="alert" hidden>
          <div class="error-copy">
            <strong id="error-title">操作未完成</strong>
            <p id="error-message"></p>
            <p class="error-hint" id="error-hint" hidden></p>
          </div>
          <button class="icon-button subtle" id="error-close" type="button" aria-label="关闭错误提示">
            <svg viewBox="0 0 20 20" aria-hidden="true">
              <path d="m6 6 8 8M14 6l-8 8" />
            </svg>
          </button>
        </section>
      </div>

      <footer class="panel-footer">
        <span id="status-line" class="status-line">正在读取状态…</span>
        <button class="text-button" id="diagnose-button" type="button">复制诊断</button>
      </footer>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
