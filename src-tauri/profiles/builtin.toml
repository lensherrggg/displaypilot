[[profiles.inputs]]
id = "hdmi1"
label = "HDMI1"
[profiles.inputs.selector]
type = "standard"
vcp_code = 0x60
value = 0x11

[[profiles.inputs]]
id = "hdmi2"
label = "HDMI2"
[profiles.inputs.selector]
type = "standard"
vcp_code = 0x60
value = 0x12

[[profiles.inputs]]
id = "dp"
label = "DP"
[profiles.inputs.selector]
type = "standard"
vcp_code = 0x60
value = 0x0F

[[profiles.inputs]]
