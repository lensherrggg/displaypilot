# DisplayPilot built-in display profiles.
#
# These profiles are compiled into the application and are never modified at runtime.
# User overrides live in the app config directory; see docs/CONFIGURATION.md.
schema_version = 1

[[profiles]]
id = "lg-27ul850"
label = "LG 27UL850"
priority = 100
current_input_vcp_code = 0x60
match = { model_name_any = ["*27UL850*", "*UL850*"] }

[profiles.capabilities]
input_switch = true

[profiles.capabilities.brightness]
supported = true
vcp_code = 0x10
min = 0
max = 255
step = 5

[profiles.capabilities.volume]
supported = "auto"
vcp_code = 0x62
min = 0
max = 255
step = 5

[profiles.capabilities.mute]
supported = "auto"
vcp_code = 0x8D
on_value = 1
off_value = 2

# Input values verified against LG 27UL850 firmware whose VCP 0x60 capabilities
# report (11 12 0F 10). Some LG firmware instead expects vendor values
# 0x90/0x91/0xD0/0xD1; override the inputs in the user config if your unit does.
[[profiles.inputs]]
id = "hdmi1"
label = "HDMI1"
[profiles.inputs.selector]
type = "standard"
vcp_code = 0x60
value = 0x11

[[profiles.inputs]]
id = "hdmi2"
label = "HDMI2"
[profiles.inputs.selector]
type = "standard"
vcp_code = 0x60
value = 0x12

[[profiles.inputs]]
id = "dp"
label = "DP"
[profiles.inputs.selector]
type = "standard"
vcp_code = 0x60
value = 0x0F

# USB-C is exposed as the second DisplayPort input (0x10) on this firmware.
[[profiles.inputs]]
id = "typec"
label = "TypeC"
[profiles.inputs.selector]
type = "standard"
vcp_code = 0x60
value = 0x10

[[profiles]]
id = "generic-ddc"
label = "通用 DDC/CI 显示器"
priority = -100
current_input_vcp_code = 0x60

[profiles.capabilities]
input_switch = true

[profiles.capabilities.brightness]
supported = "auto"
vcp_code = 0x10
min = 0
max = 255
step = 5

[profiles.capabilities.volume]
supported = "auto"
vcp_code = 0x62
min = 0
max = 255
step = 5

[profiles.capabilities.mute]
supported = "auto"
vcp_code = 0x8D
on_value = 1
off_value = 2

[[profiles.inputs]]
id = "hdmi1"
label = "HDMI1"
[profiles.inputs.selector]
type = "standard"
vcp_code = 0x60
value = 0x11

[[profiles.inputs]]
id = "hdmi2"
label = "HDMI2"
[profiles.inputs.selector]
type = "standard"
vcp_code = 0x60
value = 0x12

[[profiles.inputs]]
id = "dp"
label = "DP"
[profiles.inputs.selector]
type = "standard"
vcp_code = 0x60
value = 0x0F

[[profiles.inputs]]
id = "typec"
label = "TypeC"
[profiles.inputs.selector]
type = "standard"
vcp_code = 0x60
value = 0x1B
