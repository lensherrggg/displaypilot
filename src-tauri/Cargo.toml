[package]
name = "displaypilot"
version = "0.2.5"
description = "Cross-platform DDC/CI display input, brightness and audio control"
authors = ["DisplayPilot contributors"]
edition = "2021"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/displaypilot/displaypilot"
default-run = "displaypilot"

[lib]
name = "displaypilot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
ddc-hi = { version = "0.4.1", default-features = false, features = ["ddc-i2c", "ddc-winapi", "ddc-macos"] }
dirs = "6"
log = { version = "0.4", features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-global-shortcut = "2.4"
thiserror = "2"
tokio = { version = "1", features = ["sync", "time"] }
toml = "0.8"
toml_edit = "0.22"

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
window-vibrancy = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
# Used for display identity metadata that ddc-hi cannot expose on Apple Silicon.
ddc-macos = "0.2.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
